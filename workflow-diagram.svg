<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Instagram Unfollower Analyzer workflow diagram">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="600" y="60" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Instagram Unfollower Analyzer Workflow</text>

  <g filter="url(#shadow)">
    <rect x="80" y="130" width="220" height="120" rx="18" fill="url(#card)"/>
    <text x="190" y="175" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">1. Download</text>
    <text x="190" y="205" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="20">Instagram JSON</text>
    <text x="190" y="232" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="20">export</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="130" width="220" height="120" rx="18" fill="url(#card)"/>
    <text x="500" y="175" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">2. Upload</text>
    <text x="500" y="205" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="20">followers_1.json</text>
    <text x="500" y="232" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="20">+ following.json</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="700" y="130" width="220" height="120" rx="18" fill="url(#card)"/>
    <text x="810" y="175" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">3. Parse</text>
    <text x="810" y="205" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="20">Extract usernames</text>
    <text x="810" y="232" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="20">into sets</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="460" y="350" width="280" height="150" rx="22" fill="url(#accent)"/>
    <text x="600" y="400" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="700">4. Compare</text>
    <text x="600" y="435" text-anchor="middle" fill="#fff7ed" font-family="Arial, sans-serif" font-size="18">following - followers</text>
    <text x="600" y="460" text-anchor="middle" fill="#fff7ed" font-family="Arial, sans-serif" font-size="18">mutuals + fans</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="560" width="340" height="100" rx="18" fill="#0ea5e9"/>
    <text x="600" y="600" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="700">5. Show Results</text>
    <text x="600" y="630" text-anchor="middle" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="18">table + CSV download</text>
  </g>

  <g stroke="#f8fafc" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 190 H390"/>
    <path d="M610 190 H700"/>
    <path d="M810 250 V320"/>
    <path d="M600 320 V350"/>
    <path d="M600 500 V560"/>
  </g>

  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="18">
    <text x="335" y="180">download</text>
    <text x="640" y="180">upload</text>
    <text x="825" y="294">compare</text>
    <text x="610" y="530">results</text>
  </g>
</svg>
